name: CloudAsset CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: cloudasset
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Checkout Code
        uses: actions/checkout@v4

      - name: Step 2 - Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::183631319668:role/GitHubActions-CloudAsset
          aws-region: us-east-1

      - name: Step 3 - Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Step 4 - Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./Backend
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Step 5 - Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ACCOUNT_ID=183631319668
            ECR_REPO=$ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/cloudasset
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com
            docker pull $ECR_REPO:latest
            docker stop cloudasset-app || true
            docker rm cloudasset-app || true
            docker run -d --name cloudasset-app -p 5000:5000 $ECR_REPO:latest
            docker image prune -f
