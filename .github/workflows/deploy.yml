name: CloudAsset SSH CI/CD Pipeline

on:
  push:
    branches: [backend]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy CloudAsset to Ubuntu EC2
    runs-on: ubuntu-latest

    steps:

      - name: Step 1 - Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "========================================="
            echo "Starting CloudAsset deployment"
            echo "========================================="

            cd ~/CloudAsset

            echo "Current directory:"
            pwd

            echo "Fetching latest backend code..."

            git fetch origin backend
            git reset --hard origin/backend

            echo "Latest commit:"
            git log -1 --oneline

            echo "Updating Python dependencies..."

            if [ -f requirements.txt ]; then
              pip3 install -r requirements.txt
            fi

            echo "Restarting CloudAsset service..."

            sudo systemctl restart cloudasset

            echo "Checking CloudAsset service..."

            sudo systemctl status cloudasset --no-pager

            echo "========================================="
            echo "CloudAsset deployment completed"
            echo "========================================="